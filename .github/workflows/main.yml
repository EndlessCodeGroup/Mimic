name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout sources
      uses: actions/checkout@v7
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        java-version: 17
        distribution: temurin
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Run Check
      run: ./gradlew check -PwarningsAsErrors=true

  docs:
    name: Publish Docs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && success()

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Generate docs
        run: ./gradlew dokkaGenerate
      - name: Deploy docs
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/dokka/html
