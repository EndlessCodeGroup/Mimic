name: Publish

on:
  push:
    tags: [ v* ]

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble Plugin
        run: ./gradlew :mimic-bukkit:shadowJar

      - name: Copy plugin to root directory
        run: cp ./mimic-bukkit/build/libs/*-all.jar "Mimic-${GITHUB_REF_NAME}.jar"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "Mimic-${GITHUB_REF_NAME}.jar" --title "Mimic $GITHUB_REF_NAME"

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          # Release notes are the CHANGELOG section of the pushed tag
          export RELEASE_NOTES="$(awk -v tag="$GITHUB_REF_NAME" 'index($0, "## [" tag "]") == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md)"
          ./gradlew :mimic-bukkit:modrinth
