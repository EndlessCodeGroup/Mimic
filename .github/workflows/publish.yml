name: Publish

on:
  push:
    tags: [ v* ]

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble Plugin
        run: ./gradlew :mimic-bukkit:shadowJar

      - name: Copy plugin to root directory
        run: cp ./mimic-bukkit/build/libs/*-all.jar "Mimic-${GITHUB_REF_NAME}.jar"

      - name: Extract release notes
        # Release notes are the CHANGELOG section of the pushed tag
        run: |
          awk -v tag="$GITHUB_REF_NAME" 'index($0, "## [" tag "]") == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "No CHANGELOG section for $GITHUB_REF_NAME"; exit 1; }

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "Mimic-${GITHUB_REF_NAME}.jar" --title "Mimic $GITHUB_REF_NAME" --notes-file release-notes.md

      - name: Publish to Modrinth and Hangar
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: |
          export RELEASE_NOTES="$(cat release-notes.md)"
          # --continue: a failure on one platform doesn't block the other
          ./gradlew :mimic-bukkit:modrinth :mimic-bukkit:publishPluginPublicationToHangar --continue

      - name: Sync Modrinth and Hangar descriptions
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: ./gradlew :mimic-bukkit:modrinthSyncBody :mimic-bukkit:syncPluginPublicationMainResourcePagePageToHangar --continue
