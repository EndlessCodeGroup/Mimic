[versions]

paper = "1.20.6-R0.1-SNAPSHOT"
kotlin = "2.4.21"
kotlinx-serialization = "1.12.0"
dokka = "2.2.0"
annotations = "26.0.2"

bstats = "3.2.1"

skillapi = "3.102"
battlelevels = "6.9.1"
mmocore = "1.13.1-SNAPSHOT"
mmoitems = "6.10.1-SNAPSHOT"
mythiclib = "1.7.1-SNAPSHOT"
heroes = "1.9.30-RELEASE"
craftengine = "26.9.1"

junit = "6.1.3"
kotest = "6.2.6"
mockk = "1.14.11"

gradlePlugin-bukkitgradle = "1.1.0"
gradlePlugin-shadow = "9.6.1"
gradlePlugin-versions = "0.67.0"
gradlePlugin-mavenPublish = "0.37.0"
gradlePlugin-minotaur = "2.10.0"
gradlePlugin-spotless = "8.10.4"

[libraries]

paperApi = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
serialization-hocon = { module = "org.jetbrains.kotlinx:kotlinx-serialization-hocon", version.ref = "kotlinx-serialization" }
serialization-bom = { module = "org.jetbrains.kotlinx:kotlinx-serialization-bom", version.ref = "kotlinx-serialization" }
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }

bstats = { module = "org.bstats:bstats-bukkit", version.ref = "bstats" }

rpgplugins-skillapi = { module = "com.sucy:SkillAPI", version.ref = "skillapi" }
rpgplugins-battlelevels = { module = "me.robin:BattleLevels", version.ref = "battlelevels" }
rpgplugins-mmocore = { module = "net.Indyuce:MMOCore-API", version.ref = "mmocore" }
rpgplugins-mmoitems = { module = "net.Indyuce:MMOItems-API", version.ref = "mmoitems" }
rpgplugins-mythiclib = { module = "io.lumine:MythicLib-dist", version.ref = "mythiclib" }
rpgplugins-heroes = { module = "com.herocraftonline.heroes:Heroes", version.ref = "heroes" }
rpgplugins-craftengine-core = { module = "net.momirealms:craft-engine-core", version.ref = "craftengine" }
rpgplugins-craftengine-bukkit = { module = "net.momirealms:craft-engine-bukkit", version.ref = "craftengine" }

# Test dependencies
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

# Build dependencies
dokka = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
mavenPublish = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "gradlePlugin-mavenPublish" }
spotless = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "gradlePlugin-spotless" }

[plugins]

bukkitgradle = { id = "ru.endlesscode.bukkitgradle", version.ref = "gradlePlugin-bukkitgradle" }
shadow = { id = "com.gradleup.shadow", version.ref = "gradlePlugin-shadow" }
versions = { id = "io.github.ben-manes.versions", version.ref = "gradlePlugin-versions" }
minotaur = { id = "com.modrinth.minotaur", version.ref = "gradlePlugin-minotaur" }

[bundles]

rpgplugins = [
    "rpgplugins-skillapi",
    "rpgplugins-battlelevels",
    "rpgplugins-mmocore",
    "rpgplugins-mmoitems",
    "rpgplugins-mythiclib",
    "rpgplugins-heroes",
    "rpgplugins-craftengine-core",
    "rpgplugins-craftengine-bukkit",
]
