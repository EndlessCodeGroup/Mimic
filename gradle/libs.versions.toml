[versions]

paper = "1.20.6-R0.1-SNAPSHOT"
kotlin = "2.4.21"
kotlinx-serialization = "1.12.0"
dokka = "2.2.0"
annotations = "26.0.2"

bstats = "3.2.1"

mmocore = "1.13.1-SNAPSHOT"
mmoitems = "6.10.1-SNAPSHOT"
mythiclib = "1.7.1-SNAPSHOT"
heroes = "1.9.30-RELEASE"
craftengine = "26.9.1"
oraxen = "1.220.1"
auraskills = "2.4.0"
mcmmo = "2.3.002"
jobs = "5.2.6.3"
cmilib = "1.6.0.4"
fabled = "1.1.0"
codex = "1.2.0"
valhallammo = "premium_1.14.1"
valhallammo-free = "1.10.4"
itemsadder = "4.0.17"
nexo = "1.30.2"
mythicmobs = "5.14.0"
score = "5.25.3.9"
ecoitems = "2026.46"
eco = "2026.46"
libreforge = "2026.46"

junit = "6.1.3"
kotest = "6.2.6"
mockk = "1.14.11"

gradlePlugin-bukkitgradle = "1.1.0"
gradlePlugin-shadow = "9.6.1"
gradlePlugin-versions = "0.67.0"
gradlePlugin-mavenPublish = "0.37.0"
gradlePlugin-minotaur = "2.10.0"
gradlePlugin-hangar = "0.1.4"
gradlePlugin-spotless = "8.10.4"

[libraries]

paperApi = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
serialization-hocon = { module = "org.jetbrains.kotlinx:kotlinx-serialization-hocon", version.ref = "kotlinx-serialization" }
serialization-bom = { module = "org.jetbrains.kotlinx:kotlinx-serialization-bom", version.ref = "kotlinx-serialization" }
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }

bstats = { module = "org.bstats:bstats-bukkit", version.ref = "bstats" }

rpgplugins-mmocore = { module = "net.Indyuce:MMOCore-API", version.ref = "mmocore" }
rpgplugins-mmoitems = { module = "net.Indyuce:MMOItems-API", version.ref = "mmoitems" }
rpgplugins-mythiclib = { module = "io.lumine:MythicLib-dist", version.ref = "mythiclib" }
rpgplugins-heroes = { module = "com.herocraftonline.heroes:Heroes", version.ref = "heroes" }
rpgplugins-craftengine-core = { module = "net.momirealms:craft-engine-core", version.ref = "craftengine" }
rpgplugins-craftengine-bukkit = { module = "net.momirealms:craft-engine-bukkit", version.ref = "craftengine" }
rpgplugins-oraxen = { module = "io.th0rgal:oraxen", version.ref = "oraxen" }
rpgplugins-auraskills = { module = "dev.aurelium:auraskills-api", version.ref = "auraskills" }
rpgplugins-mcmmo = { module = "com.gmail.nossr50.mcMMO:mcMMO", version.ref = "mcmmo" }
rpgplugins-jobs = { module = "com.github.Zrips:Jobs", version.ref = "jobs" }
rpgplugins-cmilib = { module = "com.github.Zrips:CMILib", version.ref = "cmilib" }
rpgplugins-fabled = { module = "studio.magemonkey:fabled", version.ref = "fabled" }
rpgplugins-codex = { module = "studio.magemonkey:codex", version.ref = "codex" }
rpgplugins-valhallammo = { module = "me.athlaeos:valhallammo-core", version.ref = "valhallammo" }
rpgplugins-itemsadder = { module = "beer.devs:itemsadder-api", version.ref = "itemsadder" }
rpgplugins-nexo = { module = "com.nexomc:nexo", version.ref = "nexo" }
rpgplugins-mythicmobs = { module = "io.lumine:Mythic-Dist", version.ref = "mythicmobs" }
rpgplugins-score = { module = "com.github.Ssomar-Developement:SCore", version.ref = "score" }
rpgplugins-ecoitems = { module = "com.willfp:EcoItems", version.ref = "ecoitems" }
rpgplugins-eco = { module = "com.willfp:eco", version.ref = "eco" }
rpgplugins-libreforge = { module = "com.willfp:libreforge", version.ref = "libreforge" }
rpgplugins-libreforge-loader = { module = "com.willfp:libreforge-loader", version.ref = "libreforge" }

# Test dependencies
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

# Build dependencies
dokka = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
mavenPublish = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "gradlePlugin-mavenPublish" }
spotless = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "gradlePlugin-spotless" }

[plugins]

bukkitgradle = { id = "ru.endlesscode.bukkitgradle", version.ref = "gradlePlugin-bukkitgradle" }
shadow = { id = "com.gradleup.shadow", version.ref = "gradlePlugin-shadow" }
versions = { id = "io.github.ben-manes.versions", version.ref = "gradlePlugin-versions" }
minotaur = { id = "com.modrinth.minotaur", version.ref = "gradlePlugin-minotaur" }
hangar = { id = "io.papermc.hangar-publish-plugin", version.ref = "gradlePlugin-hangar" }

[bundles]

rpgplugins = [
    "rpgplugins-mmocore",
    "rpgplugins-mmoitems",
    "rpgplugins-mythiclib",
    "rpgplugins-heroes",
    "rpgplugins-craftengine-core",
    "rpgplugins-craftengine-bukkit",
    "rpgplugins-oraxen",
    "rpgplugins-auraskills",
    "rpgplugins-mcmmo",
    "rpgplugins-jobs",
    "rpgplugins-fabled",
    "rpgplugins-codex",
    "rpgplugins-valhallammo",
    "rpgplugins-itemsadder",
    "rpgplugins-nexo",
    "rpgplugins-mythicmobs",
    "rpgplugins-score",
    "rpgplugins-ecoitems",
    "rpgplugins-eco",
    "rpgplugins-libreforge-loader",
]
